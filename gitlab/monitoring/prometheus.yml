global:
  scrape_interval: 5s  # Fast scraping for real-time updates
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gitlab-exporter'
    static_configs:
      - targets: ['gitlab-exporter:9200']
    scrape_interval: 60s  # Scrape every 60 seconds (needs time for multiple GitLab API calls)
    scrape_timeout: 55s  # Wait up to 55 seconds for response  

